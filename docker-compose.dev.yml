  #     context: ./hub
  #     dockerfile: ./hub/Dockerfile
  #   environment:
  #     PORT: ${HUB1_PORT:-12240}
  #   ports:
  #     - "${HUB1_PORT:-12240}:${HUB1_PORT:-12240}"
  #   volumes:
  #     - ./hub:/app
  #     - /app/node_modules
  # hub-node-2:
  #   <<: *hub-node-1
  #   environment:
  #     PORT: ${HUB2_PORT:-12241}
  #   ports:
  #     - "${HUB2_PORT:-12241}:${HUB2_PORT:-12241}"
  # hub-node-3:
  #   <<: *hub-node-1
  #   environment:
  #     PORT: ${HUB3_PORT:-12242}
  #   ports:
  #     - "${HUB3_PORT:-12242}:${HUB3_PORT:-12242}"